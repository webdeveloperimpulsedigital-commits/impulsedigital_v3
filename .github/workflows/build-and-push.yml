name: Build and Deploy to Production Branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build

      - name: Prepare Hostinger deployment package
        run: |
          mkdir -p dist
          cp -R .next/standalone/. dist/
          cp -R public dist/
          mkdir -p dist/.next
          cp -R .next/static dist/.next/
          echo "public/blog/*" > dist/.gitignore
          echo "!public/blog/.gitkeep" >> dist/.gitignore
          echo "!public/blog/.htaccess" >> dist/.gitignore
          echo "public/blogs/*" >> dist/.gitignore
          echo "!public/blogs/.gitkeep" >> dist/.gitignore
          echo "!public/blogs/.htaccess" >> dist/.gitignore

      - name: Push built files to production branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: hostinger-deploy
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.sha }}'
          exclude_assets: '**.jpg,**.jpeg,**.png,**.gif,**.svg,**.mp4,**.webm,**.woff,**.woff2,**.ttf,**.otf,**.ico,**.pdf'
